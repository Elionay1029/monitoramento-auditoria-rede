name: Testes de auditoria de rede
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m rede_audit demo --output reports/demo
      - name: Conferir demonstracao offline
        run: python -c "import json; r=json.load(open('reports/demo/relatorio.json',encoding='utf-8')); assert r['summary']['findings_total']==5 and r['summary']['packets_analyzed']==16"
