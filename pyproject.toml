[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoramento-auditoria-rede"
version = "1.0.0"
description = "Inventario TCP local, auditoria de baseline e analise offline de PCAP com Scapy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["scapy>=2.6,<3"]

[project.scripts]
rede-audit = "rede_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
